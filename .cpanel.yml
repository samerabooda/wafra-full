---
deployment:
  tasks:
    - export COMPOSER_HOME=/home/wafragulfcommiss/.composer
    - /usr/local/bin/php /opt/cpanel/ea-wappspector/composer.phar install --no-dev --optimize-autoloader --no-interaction 2>&1
    - find /home/wafragulfcommiss/public_html -type d -exec chmod 755 {} \;
    - find /home/wafragulfcommiss/public_html -type f -exec chmod 644 {} \;
    - chmod -R 775 /home/wafragulfcommiss/public_html/storage
    - chmod -R 775 /home/wafragulfcommiss/public_html/bootstrap/cache
    - chmod 755 /home/wafragulfcommiss/public_html/artisan
    - cd /home/wafragulfcommiss/public_html && /usr/local/bin/php artisan key:generate --force --no-interaction 2>&1
    - cd /home/wafragulfcommiss/public_html && /usr/local/bin/php artisan migrate --force --no-interaction 2>&1
    - cd /home/wafragulfcommiss/public_html && /usr/local/bin/php artisan storage:link --force 2>&1
    - cd /home/wafragulfcommiss/public_html && /usr/local/bin/php artisan optimize:clear 2>&1
    - cd /home/wafragulfcommiss/public_html && /usr/local/bin/php artisan optimize 2>&1
    - echo "Deployed at $(date)"
